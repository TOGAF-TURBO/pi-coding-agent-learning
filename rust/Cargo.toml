[workspace]
resolver = "2"
members = [
    "crates/pi-types",
    "crates/pi-llm",
    "crates/pi-session",
    "crates/pi-tools",
    "crates/pi-extensions",
    "crates/pi-tui",
    "crates/pi-agent",
    "crates/pi-cli",
]
default-members = ["crates/pi-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"
repository = "https://github.com/earendil-works/pi-mono"

[workspace.dependencies]
# ── Async ──
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
futures = "0.3"
async-trait = "0.1"

# ── Serialization ──
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# ── Error handling ──
anyhow = "1"
thiserror = "2"

# ── Logging ──
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# ── HTTP / SSE ──
reqwest = { version = "0.12", default-features = false, features = [
    "json", "stream", "rustls-tls", "gzip", "deflate", "brotli",
] }
eventsource-stream = "0.2"

# ── CLI ──
clap = { version = "4", features = ["derive"] }
clap_complete = "4"

# ── TUI ──
ratatui = "0.29"
crossterm = "0.28"

# ── Database ──
rusqlite = { version = "0.32", features = ["bundled"] }

# ── Time ──
chrono = { version = "0.4", features = ["serde"] }

# ── IDs ──
uuid = { version = "1", features = ["v4", "serde"] }

# ── Crypto ──
sha2 = "0.10"

# ── Concurrency ──
dashmap = "6"
parking_lot = "0.12"

# ── Misc ──
dirs = "6"
once_cell = "1"
regex = "1"
glob = "0.3"
walkdir = "2"
unicode-width = "0.2"
unicode-segmentation = "1"
